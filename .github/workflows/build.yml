name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: call build.cmd

      - name: Test
        shell: cmd
        run: bin\JVLinkServerTray.Tests.exe

      - name: Check the tag against TrayVersion
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $m = Select-String -Path src/Core/TrayVersion.cs -Pattern 'Value = "([^"]+)"'
          $version = $m.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match TrayVersion.Value $version" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/pkg | Out-Null
          Copy-Item bin/JVLinkServerTray.exe, JVLinkServerTray.ini.example, LICENSE -Destination dist/pkg
          Compress-Archive -Path dist/pkg/* -DestinationPath dist/JVLinkServerTray.zip
          Copy-Item bin/JVLinkServerTray.exe -Destination dist
          Remove-Item dist/pkg -Recurse
          # LF line endings so that `shasum -c` / `sha256sum -c` also read the file.
          $lines = Get-FileHash dist/JVLinkServerTray.zip, dist/JVLinkServerTray.exe -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")

      - uses: actions/upload-artifact@v4
        with:
          name: JVLinkServerTray
          path: dist/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JVLinkServerTray
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/JVLinkServerTray.zip dist/JVLinkServerTray.exe dist/SHA256SUMS.txt \
            --title "JVLinkServer Tray $GITHUB_REF_NAME" \
            --notes "入れかたは README の「はじめかた」を見てください: https://github.com/$GITHUB_REPOSITORY#はじめかた"
